<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#C5A880"/>
  
  <!-- Camera Aperture Design -->
  <g transform="translate(50, 50)">
    <!-- Outer Ring -->
    <circle r="35" fill="none" stroke="#141312" stroke-width="2"/>
    
    <!-- Aperture Blades -->
    <g fill="#141312" opacity="0.8">
      <path d="M 0,-20 L 7,-7 L -7,-7 Z" transform="rotate(0)"/>
      <path d="M 0,-20 L 7,-7 L -7,-7 Z" transform="rotate(60)"/>
      <path d="M 0,-20 L 7,-7 L -7,-7 Z" transform="rotate(120)"/>
      <path d="M 0,-20 L 7,-7 L -7,-7 Z" transform="rotate(180)"/>
      <path d="M 0,-20 L 7,-7 L -7,-7 Z" transform="rotate(240)"/>
      <path d="M 0,-20 L 7,-7 L -7,-7 Z" transform="rotate(300)"/>
    </g>
    
    <!-- Center Circle -->
    <circle r="8" fill="#141312"/>
    
    <!-- RT Text -->
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
          fill="#C5A880" text-anchor="middle" letter-spacing="1">RT</text>
  </g>
</svg>
